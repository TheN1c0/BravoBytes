<!-- Floating Action Button (FAB) -->
<button 
  type="button" 
  class="ai-fab" 
  [class.active]="aiService.isOpen()"
  (click)="toggle()" 
  aria-label="Abrir Asistente Virtual con IA"
  title="Pregunta al Asistente con IA">
  <div class="fab-glow"></div>
  <div class="fab-icon-wrapper">
    <svg *ngIf="!aiService.isOpen()" class="icon-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
    <svg *ngIf="aiService.isOpen()" class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </div>
  <span class="fab-badge" *ngIf="!aiService.isOpen()">IA</span>
</button>

<!-- AI Assistant Chat Modal / Panel -->
<div class="ai-modal-overlay" *ngIf="aiService.isOpen()" (click)="close()">
  <div class="ai-modal-panel" (click)="$event.stopPropagation()">
    
    <!-- Modal Header -->
    <header class="ai-modal-header">
      <div class="header-info">
        <div class="ai-avatar">
          <span>BB</span>
          <span class="status-indicator"></span>
        </div>
        <div class="header-titles">
          <h3>BravoBot AI <span class="badge-v1">V1</span></h3>
          <p class="header-subtitle">Asistente Virtual de BravoBytes</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="quota-badge" [class.low-quota]="aiService.remainingQuota() <= 1" title="Consultas restantes en esta sesión">
          <span class="quota-dot"></span>
          <span class="quota-text">{{ aiService.remainingQuota() }} consultas</span>
        </div>
        <button type="button" class="btn-close" (click)="close()" aria-label="Cerrar chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Message History Container -->
    <div class="ai-messages-container" #messagesContainer>
      <div class="messages-list">
        
        <div 
          *ngFor="let msg of aiService.messages()" 
          class="message-wrapper" 
          [ngClass]="msg.role"
          [class.is-error]="msg.isError">
          
          <div class="message-avatar" *ngIf="msg.role === 'assistant'">
            <span>🤖</span>
          </div>

          <div class="message-bubble">
            <div class="message-text" [innerHTML]="msg.text | markdown"></div>
            <span class="message-time">{{ msg.timestamp | date:'shortTime' }}</span>
          </div>
        </div>

        <!-- Typing Indicator -->
        <div class="message-wrapper assistant" *ngIf="aiService.isLoading()">
          <div class="message-avatar">
            <span>🤖</span>
          </div>
          <div class="message-bubble typing-bubble">
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

      </div>

      <!-- Suggested Question Chips -->
      <div class="suggested-chips-section" *ngIf="aiService.messages().length <= 2 && !aiService.isLoading()">
        <p class="suggested-label">Preguntas sugeridas:</p>
        <div class="chips-list">
          <button 
            type="button" 
            class="chip-btn" 
            *ngFor="let q of suggestedQuestions"
            (click)="sendSuggested(q)">
            {{ q }}
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Footer / Input Form -->
    <footer class="ai-modal-footer">
      <form class="input-form" (ngSubmit)="submitQuestion()">
        <div class="input-wrapper">
          <input 
            type="text" 
            [(ngModel)]="userInput" 
            name="chatMessage"
            [maxlength]="MAX_CHARS"
            [disabled]="aiService.isLoading() || aiService.remainingQuota() <= 0"
            (keydown)="handleKeydown($event)"
            placeholder="Pregunta sobre proyectos, skills o contacto..." 
            autocomplete="off"
            aria-label="Mensaje para el Asistente de IA" />
          
          <span class="char-counter" [class.limit-reached]="userInput.length >= MAX_CHARS">
            {{ userInput.length }}/{{ MAX_CHARS }}
          </span>
        </div>

        <button 
          type="submit" 
          class="btn-send" 
          [disabled]="!userInput.trim() || aiService.isLoading() || aiService.remainingQuota() <= 0"
          aria-label="Enviar mensaje">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

      <div class="footer-disclaimer">
        <span>🔒 Consultas limitadas y respuestas generadas por IA sobre el portafolio.</span>
      </div>
    </footer>

  </div>
</div>
