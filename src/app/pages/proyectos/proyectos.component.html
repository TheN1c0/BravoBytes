<div class="body">
  <div class="container">

    <!-- Barra superior -->
    <nav class="navbar">
      <div class="menu-pc">
        <ul>
          <li><a class="menu" (click)="inicio()">Inicio</a></li>
          <li><a class="menu" (click)="servicios()">Servicios</a></li>
          <li><a class="menu" (click)="proyectos()">Proyectos</a></li>
          <li><a class="menu" (click)="contacto()">Contacto</a></li>
        </ul>
      </div>

      <!-- Botón hamburguesa (móvil) -->
      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [class.active]="isMenuOpen"
        aria-label="Abrir menú"
        [attr.aria-expanded]="isMenuOpen"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </nav>

    <!-- Menú desplegable -->
    <div class="desplegable" [class.active]="isMenuOpen">
      <ul>
        <li><a class="menu" (click)="inicio(); closeMenu()">Inicio</a></li>
        <li><a class="menu" (click)="servicios(); closeMenu()">Servicios</a></li>
        <li><a class="menu" (click)="proyectos(); closeMenu()">Proyectos</a></li>
        <li><a class="menu" (click)="contacto(); closeMenu()">Contacto</a></li>
      </ul>
    </div>

    <!-- Contenido principal -->
    <main class="content">
      <header class="titulo-proyectos">
        <h1>Proyectos</h1>
        <p>Haz clic en un proyecto para ver detalles.</p>
      </header>

      <section class="proyectos-container">
        <button
          type="button"
          *ngFor="let proyecto of listaProyectos; let i = index"
          class="proyecto"
          (click)="toggleExpand(i)"
          [attr.aria-expanded]="expandedIndex === i"
        >
          <h3 class="titulo-proyecto">{{ proyecto.titulo }}</h3>

          <div *ngIf="expandedIndex === i" class="contenido-proyecto">
            <div *ngFor="let item of proyecto.contenido" class="item-proyecto">
              <p>{{ item.descripcion }}</p>
              <img
                [src]="item.imagen"
                [alt]="'Imagen de ' + proyecto.titulo"
                class="imagen-proyecto"
                loading="lazy"
              />
            </div>
          </div>
        </button>
      </section>

      <p class="nota-proyectos">Próximamente habrá más proyectos...</p>
    </main>

  </div>
</div>
